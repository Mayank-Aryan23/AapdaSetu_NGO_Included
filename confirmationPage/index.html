<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Email Verified | AapdaSetu</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, #dff8ed 0%, transparent 35%),
        radial-gradient(circle at bottom right, #dcecff 0%, transparent 35%),
        linear-gradient(135deg, #f7fffb, #f3f8ff);
      color: #1f2937;
    }

    .verification-card {
      width: 100%;
      max-width: 560px;
      padding: 52px 42px;
      text-align: center;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(30, 70, 60, 0.12);
      backdrop-filter: blur(12px);
      animation: fadeUp 0.9s ease-out;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      color: #087f5b;
      margin-bottom: 30px;
      letter-spacing: -0.5px;
    }

    .logo span {
      color: #1769aa;
    }

    .success-icon {
      width: 88px;
      height: 88px;
      margin: 0 auto 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: linear-gradient(135deg, #16a36b, #0b8056);
      box-shadow: 0 12px 28px rgba(22, 163, 107, 0.28);
      animation: pop 0.5s ease-out 0.3s both;
    }

    .success-icon::after {
      content: "✓";
      color: white;
      font-size: 48px;
      font-weight: 700;
    }

    h1 {
      font-size: 32px;
      line-height: 1.25;
      color: #123b32;
      margin-bottom: 16px;
    }

    .welcome {
      font-size: 19px;
      font-weight: 600;
      color: #087f5b;
      margin-bottom: 14px;
    }

    .message {
      font-size: 16px;
      line-height: 1.7;
      color: #667085;
      max-width: 430px;
      margin: 0 auto;
    }

    .message strong {
      color: #1769aa;
      font-weight: 700;
    }

    .login-text {
      margin-top: 24px;
      padding: 16px 20px;
      border-radius: 12px;
      background: #f0faf6;
      color: #087f5b;
      font-size: 15px;
      font-weight: 600;
    }

    .bottom-line {
      width: 55px;
      height: 4px;
      margin: 30px auto 0;
      border-radius: 10px;
      background: linear-gradient(90deg, #16a36b, #1769aa);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(0.5);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 16px;
      }

      .verification-card {
        padding: 40px 24px;
        border-radius: 20px;
      }

      .logo {
        font-size: 24px;
        margin-bottom: 26px;
      }

      .success-icon {
        width: 76px;
        height: 76px;
      }

      .success-icon::after {
        font-size: 40px;
      }

      h1 {
        font-size: 26px;
      }

      .welcome {
        font-size: 17px;
      }

      .message {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="verification-card">

    <div class="success-icon"></div>

    <h1>Email Verified Successfully</h1>

    <p class="welcome">
      Welcome to AapdaSetu!
    </p>

    <p class="message">
      Your email address has been <strong>successfully verified</strong>.
      You can now log in to your <strong>AapdaSetu</strong> account
      using your registered credentials.
    </p>

    <div class="login-text">
      Please log in to continue.
    </div>

    <div class="bottom-line"></div>

  </main>

</body>
</html>
